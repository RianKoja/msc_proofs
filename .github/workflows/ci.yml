name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly Novacula rerun

permissions:
  contents: read

env:
  # Bump together with lean-toolchain.
  LEAN4EXPORT_REV: v4.34.0
  NANODA_REV: 3a2407216ee84a75f9e1aead6803d0578be06ae7

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lean kernel check; Mathlib style linters run during the build, --wfail makes them fatal.
      - uses: leanprover/lean-action@v1
        with:
          build-args: --wfail
          lint: true

      - name: Build lean4export
        run: |
          git clone --depth 1 -b "$LEAN4EXPORT_REV" https://github.com/leanprover/lean4export ../lean4export
          cp lean-toolchain ../lean4export/
          (cd ../lean4export && lake build)

      - name: Build nanoda
        run: |
          git clone https://github.com/ammkrn/nanoda_lib ../nanoda_lib
          git -C ../nanoda_lib checkout "$NANODA_REV"
          cargo build --release --manifest-path ../nanoda_lib/Cargo.toml

      # Exports only declarations in namespace Koja (and their dependencies); all of Mathlib is ~1GB.
      - name: Nanoda check
        run: |
          decls=$(grep -hoP '^(noncomputable )?(theorem|lemma|def) \K\S+' MscProofs/*.lean | sed 's/^/Koja./')
          lake env ../lean4export/.lake/build/bin/lean4export MscProofs -- $decls \
            | ../nanoda_lib/target/release/nanoda_bin nanoda.json

  # Complexity cost of every theorem (https://github.com/RianKoja/novacula). Keeps the history,
  # chart and badge on the `novacula` branch.
  novacula:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Runs on the same ref queue instead of racing to update the history branch.
    concurrency:
      group: novacula-${{ github.ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: RianKoja/novacula@main
        with:
          theorems: all
